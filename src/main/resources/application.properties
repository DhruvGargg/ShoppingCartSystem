spring.application.name=ShoppingCart

server.port=7070

spring.datasource.url=jdbc:mysql://localhost:3306/shopping_cart
spring.datasource.username=root
spring.datasource.password=Poiuy*890mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG

jwt.secret=my-super-secret-key-my-super-secret-key
jwt.expiration=3600000

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.in.dhruv.shoppingcart=DEBUG

logging.file.name=logs/application.log

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=shopping-cart-order-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.value-serialize=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.value-deserialize=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=in.dhruv.shoppingcart.event.OrderCreatedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=in.dhruv.shoppingcart.event